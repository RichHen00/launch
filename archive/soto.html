<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@800&family=Noto+Sans+JP:wght@500;600&family=LINE+Seed+JP:wght@400;700&family=Nicomoji&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #171717; --muted: #666; --page: #fff; --line: #d7d7d7; }
    body { background: #fff; font-family: "LINE Seed JP", "Noto Sans JP", sans-serif; margin: 0; }
    main { width: min(920px, calc(100% - 40px)); margin: 34px auto 60px; }
    .lesson { border: 0; background: #fff; }
    header { padding: 0 0 34px; border: 0; }
    .date { margin: 0; color: #d64747; font-size: 14px; letter-spacing: .08em; }
    .characters { padding: 34px 0 0; }
    .characters-heading { padding: 0 0 18px; border: 0; }
    .characters-heading h2 { font-size: 22px; font-weight: 500; margin: 0; }
    .kana-grid { display: flex; flex-wrap: wrap; gap: 0 16px; }
    .kana { border: 0; border-top: 1px solid var(--line); border-radius: 0; width: 10%; box-sizing: border-box; }
    .kana-top { padding: 12px 0 0; margin: 0; border: 0; color: var(--ink); text-align: center; font-size: 11.5px; line-height: 1; }
    .kana-body { min-height: 170px; padding: 0; margin: 0; background: transparent; display: flex; align-items: flex-start; justify-content: center; cursor: pointer; }
    .kana-body svg { width: 100%; height: auto; }
    .font-link { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 38px 0 0; font-size: 12px; }
    .font-link img { height: 20px; width: auto; }
    .font-link .date-stamp { color: var(--muted); font-variant-numeric: tabular-nums; }
    .font-link a { color: #d64747; }
    .lesson-content { padding: 34px 0 0; }
    .lesson-heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding: 0 0 14px; border-bottom: 1px solid var(--line); }
    .lesson-heading h2 { margin: 0; font-size: 29px; font-weight: 800; letter-spacing: -.01em; font-family: "M PLUS 1p", sans-serif; }
    .lesson-heading .ja { color: #d64747; font-size: 29px; font-weight: 600; font-family: "Noto Sans JP", sans-serif; }
    .lesson-lead { margin: 18px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .lesson-lead .kanji-line { font-family: "M PLUS 1p", sans-serif; font-weight: 800; font-size: 29px; color: var(--ink); }
    .lesson-lead .kanji-line .meaning { font-family: "LINE Seed JP", "Noto Sans JP", sans-serif; font-weight: 500; text-transform: uppercase; }
    .lesson-lead .hiragana-char { font-family: "Noto Sans JP", sans-serif; font-weight: 500; font-size: 29px; color: var(--ink); }
    .lesson-lead .romaji { color: var(--muted); font-size: 29px; font-weight: 400; }
    .lesson-lead .lead-label { color: var(--muted); font-size: 15px; font-weight: 400; }
    .clickable { cursor: pointer; }
    .clickable:hover { opacity: 0.7; }
    .characters[aria-label="Archive"] .characters-heading h2 { color: var(--muted); font-size: 15px; font-weight: 400; letter-spacing: 0; }
    .characters[aria-label="Archive"] .lesson-lead + .lesson-lead { border-top: 1px solid var(--line); padding-top: 12px; }
    .characters[aria-label="Archive"] a.date { color: #d64747; text-decoration: none; }
    /* AnimCJK stroke cards: gray silhouette guide + animated median stroke (LGPL v3) */
    .stroke-svg.acjk path[id] {
      fill: #e9e9e9;
    }
    .stroke-svg.acjk path[clip-path] {
      stroke: var(--ink);
      stroke-width: 128;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 3337;
      stroke-dashoffset: 3339;
    }
    .stroke-svg.acjk.playing path[clip-path] {
      animation: acjkDraw var(--t, .8s) linear forwards var(--d, 0s);
    }
    @keyframes acjkDraw {
      to { stroke-dashoffset: 0; }
    }
    @media (max-width: 480px) {
      main { width: 100%; margin: 20px auto 32px; padding: 0 16px; box-sizing: border-box; }
      .date { font-size: 15px; }
      .lesson-heading { flex-direction: column; gap: 4px; }
      .lesson-heading h2 { font-size: 28px; text-align: center; width: 100%; }
      .lesson-heading .ja { font-size: 18px; }
      .lesson-lead { font-size: 16px; text-align: center; }
      .characters-heading { text-align: center; }
      .characters-heading h2 { font-size: 24px; }
      .kana-grid { flex-direction: column; align-items: center; }
      .kana { width: 70vw; border-top: none; }
      .kana-top { font-size: 13px; padding: 16px 0 12px; }
      .kana-body { min-height: 0; padding: 0; }
      .kana-body svg { width: 70vw; height: auto; }
    }
  </style>
</head>
<body>

    <article class="lesson">
      <header>
        <p class="date">2026-09-21 · Outside</p>
      </header>
      <section class="lesson-content" aria-label="Lesson content">
        <div class="lesson-heading">
          <h2><span class="clickable" onclick="playSound('そと')">外</span> <span class="ja clickable" lang="ja" onclick="playSound('そと')">そと</span> <span class="meaning" style="font-size:18px;font-weight:500;">Outside</span></h2>
        </div>
        <p class="lesson-lead"><span class="hiragana-char">そ</span> <span class="romaji">so</span> <span class="hiragana-char">と</span> <span class="romaji">to</span></p>

        <p class="lesson-lead" style="margin-top:24px;"><strong>Usage:</strong> そ so と to</p>
        <p class="lesson-lead"><span class="hiragana-char">そ</span> <span class="romaji">so</span> <span class="hiragana-char">と</span> <span class="romaji">to</span></p>

        <div class="characters">
          <div class="characters-heading"><h2>Stroke order</h2></div>

          </div>
        </div>
      </section>
      <p class="font-link"><img src="assets/stamp.jpeg" alt=""><a href="https://googlefonts.github.io/japanese/#nicomoji" target="_blank" rel="noopener">G Fonts Japanese types</a></p>
    </article>
  </main>
  <script>
    function playSound(word) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(word);
      u.lang = 'ja-JP';
      var v = speechSynthesis.getVoices().filter(function (v) { return v.lang === 'ja-JP'; })[0];
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
    function replayStroke(svg) {
      svg.classList.remove('playing');
      void svg.getBoundingClientRect();
      svg.classList.add('playing');
    }
    (function () {
      if (window.speechSynthesis) {
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = function () {
          speechSynthesis.getVoices();
          speechSynthesis.onvoiceschanged = null;
        };
      }
      var date = document.querySelector('.date');
      var english = date && date.textContent.split(' \u00b7 ')[1];
      var match = date && date.textContent.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match && english) {
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        document.title = Number(match[3]) + ' ' + months[Number(match[2]) - 1] + ' ' + match[1].slice(2) + ' - ' + english.trim();
      }
    }());
    document.querySelectorAll('.kana-body').forEach(function (body) {
      body.addEventListener('click', function () {
        var svg = body.querySelector('.stroke-svg');
        if (svg) replayStroke(svg);
      });
    });
  </script>
</body>
</html>
