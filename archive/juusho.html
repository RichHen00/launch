<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@800&family=Noto+Sans+JP:wght@500;600&family=LINE+Seed+JP:wght@400;700&family=Nicomoji&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #171717; --muted: #666; --page: #fff; --line: #d7d7d7; }
    body { background: #fff; font-family: "LINE Seed JP", "Noto Sans JP", sans-serif; margin: 0; }
    main { width: min(920px, calc(100% - 40px)); margin: 34px auto 60px; }
    .lesson { border: 0; background: #fff; }
    header { padding: 0 0 34px; border: 0; }
    .date { margin: 0; color: #d64747; font-size: 14px; letter-spacing: .08em; }
    .tab-bar { display: flex; align-items: baseline; border-bottom: 1px solid var(--line); padding: 0 0 10px; gap: 20px; }
    .tab-bar h2 { flex: 1; margin: 0; font-size: 29px; font-weight: 800; letter-spacing: -.01em; font-family: "M PLUS 1p", sans-serif; }
    .tab-bar h2 > span:first-child { color: #d64747; }
    .tab-bar .meaning { font-family: "LINE Seed JP", "Noto Sans JP", sans-serif; font-size: 18px; font-weight: 500; color: var(--muted); }
    .tab-btn { background: none; border: none; padding: 0; font-size: 18px; font-weight: 500; font-family: "LINE Seed JP", "Noto Sans JP", sans-serif; color: var(--muted); cursor: pointer; line-height: 1; }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.open { color: var(--ink); }
    .api-panel { display: none; padding: 14px 0 18px; border-bottom: 1px solid var(--line); }
    .api-panel.open { display: block; }
    .api-row { display: grid; grid-template-columns: 72px minmax(140px, 1fr) auto; align-items: center; gap: 8px; margin: 0 0 8px; }
    .api-row label { font-size: 13px; color: var(--muted); }
    .api-row input { font-size: 13px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 4px; font-family: ui-monospace, Menlo, monospace; min-width: 0; cursor: text; }
    .api-row input.cred-idle { color: var(--muted); background: #fafafa; }
    .api-row input.cred-empty { color: #aaa; font-style: italic; }
    .api-row button { font-size: 13px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; background: #fff; white-space: nowrap; }
    .api-row button:hover { background: #f5f5f5; }
    .api-status { font-size: 12px; color: var(--muted); min-height: 14px; margin: 4px 0 0; }
    .api-status.ok { color: #1a7f37; }
    .api-status.err { color: #c62828; }
    .api-log { display: none; margin: 10px 0 0; padding: 8px 10px; background: #111; color: #0f0; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
    .api-log.open { display: block; }
    .api-log.err { color: #f66; }
    .characters { padding: 34px 0 0; }
    .characters-heading { padding: 0 0 18px; border: 0; }
    .characters-heading h2 { font-size: 22px; font-weight: 500; margin: 0; }
    .kana-grid { display: flex; flex-wrap: wrap; gap: 0 16px; }
    .kana { border: 0; border-top: 1px solid var(--line); border-radius: 0; width: 10%; box-sizing: border-box; }
    .kana-top { padding: 12px 0 0; margin: 0; border: 0; color: var(--ink); text-align: center; font-size: 11.5px; line-height: 1; }
    .kana-body { min-height: 170px; padding: 0; margin: 0; background: transparent; display: flex; align-items: flex-start; justify-content: center; cursor: pointer; }
    .kana-body svg { width: 100%; height: auto; }
    .font-link { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 38px 0 0; font-size: 12px; }
    .font-link img { height: 20px; width: auto; }
    .font-link .date-stamp { color: var(--muted); font-variant-numeric: tabular-nums; }
    .font-link a { color: #d64747; }
    .lesson-content { padding: 34px 0 0; }
    .lesson-heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding: 0; border-bottom: none; }
    .lesson-heading h2 { margin: 0; font-size: 29px; font-weight: 800; letter-spacing: -.01em; font-family: "M PLUS 1p", sans-serif; }
    .lesson-heading .ja { color: #d64747; font-size: 29px; font-weight: 600; font-family: "Noto Sans JP", sans-serif; }
    .lesson-lead { margin: 18px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .lesson-lead .kanji-line { font-family: "M PLUS 1p", sans-serif; font-weight: 800; font-size: 29px; color: var(--ink); }
    .lesson-lead .kanji-line .meaning { font-family: "LINE Seed JP", "Noto Sans JP", sans-serif; font-weight: 500; text-transform: uppercase; }
    .lesson-lead .hiragana-char { font-family: "Noto Sans JP", sans-serif; font-weight: 500; font-size: 29px; color: var(--ink); }
    .lesson-lead .romaji { color: var(--muted); font-size: 29px; font-weight: 400; }
    .lesson-lead .lead-label { color: var(--muted); font-size: 15px; font-weight: 400; }
    .clickable { cursor: pointer; }
    .clickable:hover { opacity: 0.7; }
    .ja-body .ja-link { color: inherit; border-bottom: 1px dotted var(--line); }
    .characters[aria-label="Archive"] .characters-heading h2 { color: var(--muted); font-size: 15px; font-weight: 400; letter-spacing: 0; }
    .characters[aria-label="Archive"] .lesson-lead + .lesson-lead { border-top: 1px solid var(--line); padding-top: 12px; }
    .characters[aria-label="Archive"] a.date { color: #d64747; text-decoration: none; }
    /* AnimCJK stroke cards: gray silhouette guide + animated median stroke (LGPL v3) */
    .stroke-svg.acjk path[id] {
      fill: #e9e9e9;
    }
    .stroke-svg.acjk path[clip-path] {
      stroke: var(--ink);
      stroke-width: 128;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 3337;
      stroke-dashoffset: 3339;
    }
    .stroke-svg.acjk.playing path[clip-path] {
      animation: acjkDraw var(--t, .8s) linear forwards var(--d, 0s);
    }
    @keyframes acjkDraw {
      to { stroke-dashoffset: 0; }
    }
    @media (max-width: 480px) {
      main { width: 100%; margin: 20px auto 32px; padding: 0 16px; box-sizing: border-box; }
      .date { font-size: 15px; }
      .lesson-heading { flex-direction: column; gap: 4px; }
      .lesson-heading h2 { font-size: 28px; text-align: center; width: 100%; }
      .lesson-heading .ja { font-size: 18px; }
      .lesson-lead { font-size: 16px; text-align: center; }
      .characters-heading { text-align: center; }
      .characters-heading h2 { font-size: 24px; }
      .kana-grid { flex-direction: column; align-items: center; }
      .kana { width: 70vw; border-top: none; }
      .kana-top { font-size: 13px; padding: 16px 0 12px; }
      .kana-body { min-height: 0; padding: 0; }
      .kana-body svg { width: 70vw; height: auto; }
    }
  </style>

  <script>
    var EL_KEY_K   = 'el_api_key';
    var EL_VOICE_K = 'el_voice_id';
    var EL_MODEL   = 'eleven_multilingual_v2';
    var EL_MODEL_JA = 'eleven_flash_v2_5';
    var ssVoices = [];
    var ssVoice = null;

    // Longest key wins when matching. Build injects the lesson word.
    var KANJI_READING = {
      '住所': 'じゅうしょ',
    };

    function isJaText(s) {
      return /[぀-ヿ㐀-鿿＀-￯]/.test(s);
    }

    function harvestJaReadings(root) {
      var re = /([㐀-鿿]+)["']?\s*\(([぀-ゟ]+)/g;
      root.querySelectorAll('p').forEach(function (p) {
        var t = p.textContent;
        var m;
        while ((m = re.exec(t)) !== null) {
          if (!KANJI_READING[m[1]] || m[1].length >= 2) KANJI_READING[m[1]] = m[2];
        }
      });
    }

    // Pure-kanji token with a known reading → use that (中 → なか).
    // Anything with kana (中にあります, すこしでも…です。) → speak the surface
    // text as one unit so the ja model gets full context for pronunciation.
    function resolveJaReading(token) {
      if (KANJI_READING[token] && /^[㐀-鿿]+$/.test(token)) {
        return KANJI_READING[token];
      }
      return token;
    }

    // Wrap every contiguous Japanese run as one clickable unit. Runs break only
    // on non-JA (spaces, Latin, ASCII quotes) — never between kanji and kana.
    function linkJaBody(root) {
      if (!root) return;
      harvestJaReadings(root);
      var re = /[　-ヿ㐀-鿿＀-￯]+/g;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (node) {
        var parent = node.parentElement;
        if (!parent || parent.closest('.hiragana-char, .clickable, .ja-link, .tab-bar, .api-panel, script, style')) return;
        var text = node.textContent;
        if (!isJaText(text)) return;
        re.lastIndex = 0;
        var frag = document.createDocumentFragment();
        var last = 0;
        var m;
        while ((m = re.exec(text)) !== null) {
          if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
          var token = m[0];
          var span = document.createElement('span');
          span.className = 'clickable ja-link';
          span.setAttribute('lang', 'ja');
          span.setAttribute('data-reading', resolveJaReading(token));
          span.textContent = token;
          frag.appendChild(span);
          last = m.index + token.length;
        }
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        if (last > 0) node.parentNode.replaceChild(frag, node);
      });
    }

    function apiLog(msg, isErr) {
      var el = document.getElementById('api-log');
      if (!el) return;
      var t = new Date().toTimeString().slice(0, 8);
      el.classList.add('open');
      el.classList.toggle('err', !!isErr);
      el.textContent += '[' + t + '] ' + msg + '\n';
      el.scrollTop = el.scrollHeight;
      if (isErr) console.warn('[EL]', msg); else console.log('[EL]', msg);
    }

    function activeKey() {
      var i = document.getElementById('el-key');
      if (i && !i.readOnly && i.value.trim()) return i.value.trim();
      return localStorage.getItem(EL_KEY_K) || '';
    }

    function activeVoice() {
      var i = document.getElementById('el-voice');
      if (i && !i.readOnly && i.value.trim()) return i.value.trim();
      return localStorage.getItem(EL_VOICE_K) || '';
    }

    function elTts(voice, text, cb) {
      var key = activeKey();
      if (!key) { apiLog('tts: no key', true); if (cb) cb(false, 'No API key.'); return; }
      var ctx = getElCtx();
      if (!ctx) { apiLog('tts: no AudioContext', true); if (cb) cb(false, 'No AudioContext.'); return; }
      if (ctx.state === 'suspended') ctx.resume();
      var t0 = performance.now();
      var body = { text: text, model_id: EL_MODEL, voice_settings: { stability: 0.5, similarity_boost: 0.75 } };
      if (isJaText(text)) {
        body.model_id = EL_MODEL_JA;
        body.language_code = 'ja';
        body.apply_language_text_normalization = true;
      }
      fetch('https://api.elevenlabs.io/v1/text-to-speech/' + voice, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'xi-api-key': key },
        body: JSON.stringify(body)
      })
      .then(function(res) {
        var ms = Math.round(performance.now() - t0);
        if (!res.ok) {
          return res.text().then(function(t) {
            var msg = 'HTTP ' + res.status + ' ' + t;
            apiLog('tts "' + text + '" ' + msg, true);
            if (cb) cb(false, msg);
          });
        }
        return res.arrayBuffer().then(function(buf) {
          // Prefer <audio> blob — Web Audio can report onended while silent (Safari).
          var blob = new Blob([buf], { type: 'audio/mpeg' });
          var url = URL.createObjectURL(blob);
          var el = new Audio(url);
          el.volume = 1;
          var finished = false;
          function done(ok, detail) {
            if (finished) return;
            finished = true;
            URL.revokeObjectURL(url);
            if (cb) cb(ok, detail);
          }
          el.onended = function () {
            var d = (el.duration && isFinite(el.duration)) ? el.duration.toFixed(2) + 's' : '?s';
            apiLog('played "' + text + '" <audio> ' + d + ' (' + ms + 'ms)');
            done(true, d);
          };
          el.onerror = function () {
            var err = (el.error && el.error.message) || 'unknown';
            apiLog('<audio> error: ' + err + ' — AudioContext fallback', true);
            playViaWebAudio(ctx, buf, text, ms, cb, done);
          };
          apiLog('tts HTTP 200 (' + ms + 'ms) bytes=' + buf.byteLength + ' ctx=' + ctx.state);
          var p = el.play();
          if (p && p.then) {
            p.then(function () {
              apiLog('<audio>.play() ok');
            }, function (e) {
              apiLog('<audio>.play() REJECTED: ' + (e && e.message) + ' — AudioContext fallback', true);
              playViaWebAudio(ctx, buf, text, ms, cb, done);
            });
          }
        });
      })
      .catch(function (err) {
        apiLog('tts network: ' + err.message, true);
        if (cb) cb(false, 'Network error.');
      });
    }

    function playViaWebAudio(ctx, buf, text, ms, cb, done) {
      if (!ctx) {
        apiLog('no AudioContext for fallback', true);
        if (done) done(false, 'No audio output.');
        return;
      }
      var p = (ctx.state === 'suspended') ? ctx.resume() : Promise.resolve();
      Promise.resolve(p).then(function () {
        return ctx.decodeAudioData(buf.slice(0));
      }).then(function (decoded) {
        var src = ctx.createBufferSource();
        src.buffer = decoded;
        src.connect(ctx.destination);
        src.onended = function () {
          var d = decoded.duration.toFixed(2) + 's';
          apiLog('played "' + text + '" WebAudio ' + d + ' (' + ms + 'ms)');
          if (done) done(true, d);
        };
        src.start(0);
        apiLog('WebAudio src.start ctx=' + ctx.state);
      }, function (e) {
        apiLog('WebAudio decode fail: ' + (e && e.message || e), true);
        if (done) done(false, 'Decode failed.');
      }).catch(function (e) {
        apiLog('WebAudio fail: ' + (e && e.message || e), true);
        if (done) done(false, 'Audio failed.');
      });
    }

    // Unified sound: ElevenLabs when credentials exist, system TTS otherwise.
    function playSound(text) {
      var key = localStorage.getItem(EL_KEY_K) || '';
      var voice = localStorage.getItem(EL_VOICE_K) || '';
      if (key && voice) {
        elTts(voice, text, null);
      } else {
        apiLog('no credentials — system TTS "' + text + '"');
        speakChar(text);
      }
    }

    function playViaEL(reading) {
      playSound(reading);
    }var elCtx = null;
    function getElCtx() {
      if (!elCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        elCtx = new AC();
        apiLog('AudioContext created sr=' + elCtx.sampleRate + ' state=' + elCtx.state);
      }
      if (elCtx.state === 'suspended') {
        elCtx.resume().then(function () {
          apiLog('AudioContext resumed state=' + elCtx.state);
        }, function (e) {
          apiLog('AudioContext resume REJECTED: ' + (e && e.message), true);
        });
      }
      return elCtx;
    }

    function pickJaVoice() {
      var ja = ssVoices.filter(function (v) { return /^ja/i.test(v.lang); });
      var kyoko = ja.filter(function (v) { return /kyoko/i.test(v.name); });
      var enh = kyoko.filter(function (v) { return /enhanced/i.test(v.name); });
      return enh[0] || kyoko[0] || ja[0] || null;
    }

    function refreshVoices() {
      ssVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      ssVoice = pickJaVoice();
    }

    // Split long Japanese for speechSynthesis (browsers clip ~15s utterances).
    // Pause at sentence end; mid-sentence only after、once already long.
    function splitJaForSpeech(s) {
      if (!s) return [];
      var parts = [];
      var buf = '';
      for (var i = 0; i < s.length; i++) {
        var ch = s.charAt(i);
        buf += ch;
        if (ch === '。' || ch === '！' || ch === '？' || ch === '!' || ch === '?') {
          parts.push(buf);
          buf = '';
        } else if (ch === '、' && buf.length >= 24) {
          parts.push(buf);
          buf = '';
        }
      }
      if (buf) parts.push(buf);
      return parts.length ? parts : [s];
    }

    function speakChar(reading) {
      if (!window.speechSynthesis || !reading) return;
      var synth = window.speechSynthesis;
      synth.cancel();
      if (!ssVoice) refreshVoices();
      var parts = splitJaForSpeech(reading);
      function speakAt(i) {
        if (i >= parts.length) return;
        var u = new SpeechSynthesisUtterance(parts[i]);
        if (ssVoice) { u.voice = ssVoice; u.lang = ssVoice.lang; } else { u.lang = 'ja-JP'; }
        u.rate = 0.9;
        u.pitch = 1.0;
        u.onend = function () {
          if (i + 1 < parts.length) setTimeout(function () { speakAt(i + 1); }, 80);
        };
        // Chrome/Safari: speak() in the same turn as cancel() clips the start.
        setTimeout(function () { synth.speak(u); }, i === 0 ? 100 : 60);
      }
      speakAt(0);
    }

    function replayStroke(svg) {
      svg.classList.remove('playing');
      void svg.getBoundingClientRect();
      svg.classList.add('playing');
    }
    (function () {
      refreshVoices();
      if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = refreshVoices;
      }
      document.querySelectorAll('.ja-body').forEach(linkJaBody);
      document.addEventListener('click', function (e) {
        var t = e.target.closest('[data-reading]');
        if (t) playViaEL(t.getAttribute('data-reading'));
      });
      document.addEventListener('visibilitychange', function () {
        apiLog('visibility=' + document.visibilityState + ' ctx=' + (elCtx ? elCtx.state : 'none'));
      });
      var date = document.querySelector('.date');
      var text = date ? date.textContent : '';
      var match = text.match(/(\d{4})-(\d{2})-(\d{2})/);
      var englishMatch = text.match(/\d{4}-\d{2}-\d{2} \u00b7 (.+)$/);
      var english = englishMatch ? englishMatch[1].trim() : '';
      if (match && english) {
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        document.title = Number(match[3]) + ' ' + months[Number(match[2]) - 1] + ' ' + match[1].slice(2) + ' - ' + english.trim();
      }
    }());
    document.querySelectorAll('.kana-body').forEach(function (body) {
      body.addEventListener('click', function () {
        var svg = body.querySelector('.stroke-svg');
        if (svg) replayStroke(svg);
      });
    });
  </script>
</body>
</html>
